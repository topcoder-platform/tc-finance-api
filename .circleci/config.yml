version: 2.1

parameters:
  reset-db:
    type: boolean
    default: false

defaults: &defaults
    docker:
        - image: cimg/python:3.13.2-browsers

install_dependencies: &install_dependencies
    name: Install Dependencies
    command: |
        sudo apt update
        sudo apt install -y jq python3-pip
        sudo pip3 install awscli --upgrade

install_deploy_scripts: &install_deploy_scripts
    name: Install Deployment Scripts
    command: |
        git clone --branch v1.4.17 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript
        cp ../buildscript/master_deploy.sh .
        cp ../buildscript/buildenv.sh .
        cp ../buildscript/awsconfiguration.sh .
        cp ../buildscript/psvar-processor.sh .
        test "$(git -C ../buildscript rev-parse HEAD)" = "31be63398bb230d551579a41de7b21ef7f1674e4"
        DEPLOY_SCRIPT_SOURCE=../buildscript/master_deploy.sh python3 -B -m unittest discover -s deployment -p 'test_*.py'
        python3 deployment/prepare-deploy-script.py master_deploy.sh
        bash -n master_deploy.sh


build_and_deploy_steps: &build_and_deploy_steps
    - checkout
    - setup_remote_docker
    - run: *install_dependencies
    - run: *install_deploy_scripts
    - run:
          name: Build Docker Image
          command: |
              # ./build.sh <<pipeline.parameters.reset-db>>
              docker buildx build --no-cache=true --build-arg RESET_DB_ARG=<<pipeline.parameters.reset-db>> --build-arg SEED_DATA_ARG=${DEPLOYMENT_ENVIRONMENT} -t ${APPNAME}:latest .
    - deploy:
          name: Deploy Using MasterScript
          command: |
              ./awsconfiguration.sh $DEPLOY_ENV
              source awsenvconf
              ./psvar-processor.sh -t appenv -p /config/${APPNAME}/deployvar
              source deployvar_env
              ./master_deploy.sh -d ECS -e $DEPLOY_ENV -t latest -j /config/common/global-appvar,/config/${APPNAME}/appvar -i ${APPNAME} -p FARGATE

jobs:
    build-dev:
        <<: *defaults
        environment:
            DEPLOY_ENV: 'DEV'
            LOGICAL_ENV: 'dev'
            APPNAME: 'finance-api-v6'
            DEPLOYMENT_ENVIRONMENT: 'dev'
        steps: *build_and_deploy_steps

    build-prod:
        <<: *defaults
        environment:
            DEPLOY_ENV: 'PROD'
            LOGICAL_ENV: 'prod'
            APPNAME: 'finance-api-v6'
            DEPLOYMENT_ENVIRONMENT: 'prod'
        steps: *build_and_deploy_steps

workflows:
    version: 2
    build:
        jobs:
            - 'build-dev':
                  context: org-global
                  filters:
                      branches:
                          only:
                              - dev
                              - engagements
                              - PM-4789_payment-migrations
                              - PM-5193
                      tags:
                        only: /^dev-.*/
            - 'build-prod':
                  context: org-global
                  filters:
                      branches:
                          only:
                              - master
